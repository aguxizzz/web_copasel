name: Procesar boletas

on:
  push:
    paths:
      - 'boletas_input/**'
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install script dependencies
        run: pip install pdfplumber pypdf

      - name: Run process_boletas.py
        run: python process_boletas.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MES=$(date +%Y-%m)
          git add app/static/montos/payments.json app/static/pdfs/ boletas_input/
          git diff --staged --quiet || git commit -m "Boletas $MES"
          git push
